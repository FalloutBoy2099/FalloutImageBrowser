name: Build

# Builds the release binaries for Windows, Linux and macOS (x64 and arm64) on GitHub's own runners, runs the tests on
# one runner per OS, and packs every binary into fallout_image_browser-<version>-<os>-<arch>.zip (the same names as
# publish.ps1 / publish.sh).
#
#   * push / pull request : build + tests, the zips are kept as workflow artifacts
#   * push of a tag v*    : the zips are also attached to a GitHub release (the tag must match the version in Cargo.toml)
#   * manual run          : Actions tab -> Build -> Run workflow

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the previous run (tags are never cancelled).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Oldest macOS the binaries are built for.
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  build:
    name: ${{ matrix.key }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: windows-x64,   os: windows-latest,   target: x86_64-pc-windows-msvc,    test: true }
          # Cross-compiled with the ARM64 MSVC tools preinstalled on the Windows runner image (cannot be run there).
          - { key: windows-arm64, os: windows-latest,   target: aarch64-pc-windows-msvc,   test: false }
          # Ubuntu 22.04 (glibc 2.35): the binaries also run on Debian 12 and newer.
          - { key: linux-x64,     os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  test: true }
          # Native arm64 runner (free for public repositories).
          - { key: linux-arm64,   os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, test: false }
          # macos-latest is Apple silicon; the Intel build is cross-compiled with the same Xcode.
          - { key: macos-arm64,   os: macos-latest,     target: aarch64-apple-darwin,      test: true }
          - { key: macos-x64,     os: macos-latest,     target: x86_64-apple-darwin,       test: false }

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.key }}

      - name: Tests
        if: matrix.test
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          # First name / version of the [package] section of Cargo.toml.
          value() { awk -v key="$1" '/^\[/ { p = ($0 == "[package]") } p && $1 == key && $2 == "=" { gsub(/"/, "", $3); print $3; exit }' Cargo.toml; }
          name="$(value name)"
          version="$(value version)"
          root="${name}-${version}-${{ matrix.key }}"
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi

          mkdir -p "stage/${root}" dist
          cp "target/${{ matrix.target }}/release/${name}${exe}" "stage/${root}/"
          chmod 755 "stage/${root}/${name}${exe}"
          cp README.md "stage/${root}/"
          for f in LICENSE LICENSE.md LICENSE.txt; do if [ -f "$f" ]; then cp "$f" "stage/${root}/"; fi; done

          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd stage && 7z a -tzip -mx=9 "../dist/${root}.zip" "${root}" > /dev/null)
          else
            # Info-ZIP keeps the Unix permissions: the executable stays executable after unzip.
            (cd stage && zip -qrX "../dist/${root}.zip" "${root}")
          fi
          ls -l dist
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match the version in Cargo.toml
        run: |
          version="$(awk '/^\[/ { p = ($0 == "[package]") } p && $1 == "version" && $2 == "=" { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in Cargo.toml"
            exit 1
          fi

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
