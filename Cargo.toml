[package]
name = "fallout_image_browser"
version = "0.1.0"
edition = "2024"
description = "Visionneuse / convertisseur d'images ultra rapide pour Fallout (FRM, PAL, RIX, ART, ...)"
license = "MIT"

[build-dependencies]
embed-resource = "3"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu_no_default_features", "default_fonts", "persistence", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
flate2 = "1"
rayon = "1"
rfd = "0.15"
sys-locale = "0.3"
color_quant = "1"
sha2 = "0.10"
gif = "0.13"
tiff = "0.10"
jpeg-encoder = "0.7"
kamadak-exif = "0.6"
texture2ddecoder = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
png = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "webp", "png"] }
sevenz-rust2 = { version = "0.24", default-features = false }
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Registry", "Win32_Security", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "dx12", "vulkan"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Optimisé pour la taille : à vitesse égale en pratique (mesuré), l'exécutable est ~35 % plus petit.
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

# Backends graphiques limités à ce dont chaque système a besoin (réduit nettement la taille de l'exécutable).
[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "gles"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal"] }

# cargo build --profile tiny : encore ~20 % plus petit, mais un plantage de décodeur arrête alors le programme.
[profile.tiny]
inherits = "release"
opt-level = "z"
panic = "abort"

# Outil de développement : régénère les icônes à partir de assets/icon_source.webp (cargo run --release --example genicon)
[[example]]
name = "genicon"
path = "assets/genicon.rs"

[dev-dependencies]
# Validité du JSON et du XML produits par les boutons « copier les informations ».
serde_json = "1"
roxmltree = "0.20"
