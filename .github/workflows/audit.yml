name: Audit

# Checks the dependencies of both projects (the application and ShellExtension/) against the RustSec advisory database.
# It runs when a manifest or lock file changes, and every Monday so a newly published advisory is noticed even if
# nobody touches the repository.

on:
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/audit.yml'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/audit.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Application
        run: cargo audit

      - name: Explorer extension
        working-directory: ShellExtension
        run: cargo audit
